name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste job URL …
        2. Click …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - resume.buzz (hosted)
        - Self-hosted
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser, OS, and for self-hosted the Node and pnpm versions and the commit you are on.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact anything personal. Job URLs and resume text are personal.
      render: text
