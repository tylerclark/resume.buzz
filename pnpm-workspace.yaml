allowBuilds:
  simple-git-hooks: false
  esbuild: true
  sharp: false
  unrs-resolver: false

# GHSA-67mh-4wv8-2f99: drizzle-kit's legacy @esbuild-kit loader pins esbuild 0.18. Nothing here uses it,
# but the advisory needs >=0.25, which the loader works with.
overrides:
  esbuild@<0.25.0: '>=0.25.0'
  # Firecrawl's SDK (and the `firecrawl` package it wraps) pin axios 1.18, which has a batch of advisories
  # fixed in 1.20 (GHSA-44g4-m2mj-wpvx and others).
  axios@<1.20.0: '>=1.20.0'
